# Cada workspace remoto aparece como "<clave>: <nombre>" en el sidebar, así que
# la clave es la etiqueta. target es lo que reciba ssh.
#
# remote_bin es necesario porque el plugin no resuelve los shims de mise en la
# sesión SSH que crea para el host remoto.

[hosts.devbox]
target = "devbox"
remote_bin = "/Users/rob/.local/share/mise/shims/herdr"

[hosts.gpu]
target = "devbox-gpu"
remote_bin = "/home/rob/.local/share/mise/shims/herdr"
